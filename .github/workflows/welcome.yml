name: Welcome New Contributors
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "👋 Thanks for opening your first issue! We'll take a look soon. Make sure you've checked the [contributing guide](CONTRIBUTING.md)."
          pr-message: "🎉 Thanks for your first pull request! Please make sure your changes pass the CI checks."
